<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Saudação Personalizada</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <main class="cartao">
            <h1>Saudação Personalizada</h1>
            <p class="subtitulo">Digite seu nome e clique em Saudar.</p>


            <div class="formulario">
                <label for="nome">Digite seu nome:</label>
                <div class="linha">
                    <input type="text" id="nome" placeholder="Deborah">
                    <button id="saudar">Saudar</button>
                </div>
                <p id="resultado"></p>
            </div>
        </main>

        <script src="../js/script.js"></script>

    </body>
</html>

<!DOCTYPE html> <!-- Importante colocar o tipo para fins de indexação. Nada garante que o arquivo contenha HTML mesmo que a extensão seja ".html". -->
<html lang="pt-BR"> <!-- Essencial para a página principal. -->
    <!-- Todo o conteúdo HTML fica aqui dentro. -->
     <head>
        <!-- Aqui vêm informações para o servidor, assim como metadados. "Configurações invisíveis ao usuário". -->
         <meta charset="UTF-8"> <!-- Acentuação. -->
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Prepara o terreno para o desgin responsivo. -->
         <title>Hello, world!</title> <!-- Nome que aparece na aba do navegador. -->
     </head>
     <body>
        <!-- Aqui vêm informações para o navegador, tudo o que é processado/renderizado localmente. "O que aparece na tela". -->
     </body>
</html>
